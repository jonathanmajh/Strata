name: Scripts test

# Disabled in this fork: only the gfx900 image builder (docker-gfx900.yml) runs here.
# Kept as manual-trigger-only so GitHub never fires it automatically.
on:
  workflow_dispatch: null

permissions:
  contents: read

jobs:
  node-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test .github/scripts/item-check.test.js
